# Index to scan
indices:
  - "NIFTY"

# Monte Carlo simulation settings
simulation:
  days_to_simulate: 5
  num_iterations: 5000
  lookback_days: 252

# Notification settings
scoring:
  top_n_to_notify: 5

# Ollama LLM settings (change model here without editing code)
ollama:
  model: "qwen3:8b"
  router_tokens: 512
  analyst_tokens: 1024
  context_window: 8192

# Prediction evaluation horizons (hours after prediction timestamp)
evaluation:
  horizons_hours:
    - 1
    - 24
    - 72
